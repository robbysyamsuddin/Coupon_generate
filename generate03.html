<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kupon A4 Massal (Nomor di Kiri & Kanan)</title>
    <!-- Library HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #059669;
            --bg-color: #e5e7eb;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #333;
            padding: 15px;
        }

        .main-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Form Input */
        .panel {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        h2 {
            margin-bottom: 10px;
            color: #1f2937;
            font-size: 1.15rem;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 6px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #059669;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 6px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 2px;
            font-size: 0.72rem;
            color: #4b5563;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 5px 7px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 0.78rem;
            outline: none;
        }

        input[type="color"] {
            width: 100%;
            height: 35px;
            cursor: pointer;
            padding: 2px;
            border-radius: 5px;
            border: 1px solid #d1d5db;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }

        .btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            text-align: center;
        }

        .btn-print {
            background-color: #059669;
        }

        .btn-print:hover {
            background-color: #047857;
        }

        .btn-download {
            background-color: #0284c7;
        }

        .btn-download:hover {
            background-color: #0369a1;
        }

        /* PREVIEW & CETAK LEMBAR A4 */
        .preview-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            overflow-x: auto;
        }

        .page-indicator {
            font-size: 0.8rem;
            font-weight: 700;
            color: #4b5563;
            margin-bottom: 4px;
        }

        /* Presisi Lembar A4 Portrait: 210mm x 297mm */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 6mm 5mm;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(5, 1fr);
            gap: 3mm 4mm;
            box-sizing: border-box;
            page-break-after: always;
        }

        /* 1 Blok Kotak Kupon Medium */
        .coupon-block {
            border: 1px dashed #9ca3af;
            border-radius: 5px;
            display: flex;
            color: #ffffff;
            overflow: hidden;
            position: relative;
            height: 54mm;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .coupon-main {
            flex: 1.8;
            padding: 5px 7px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .coupon-divider {
            width: 0;
            border-left: 1.2px dashed rgba(255, 255, 255, 0.7);
            position: relative;
        }

        .coupon-divider::before {
            content: '✂';
            position: absolute;
            top: 50%;
            left: -5px;
            transform: translateY(-50%);
            font-size: 9px;
            color: white;
        }

        .coupon-stub {
            flex: 1.1;
            padding: 4px 5px;
            background: rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-row img {
            max-height: 18px;
            max-width: 45px;
            object-fit: contain;
        }

        .inst-name {
            font-size: 0.52rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .event-title {
            font-size: 0.68rem;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .event-sub {
            font-size: 0.48rem;
            opacity: 0.9;
            margin-top: 1px;
        }

        .event-desc {
            font-size: 0.45rem;
            opacity: 0.85;
            line-height: 1.1;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Kotak Nomor di Sebelah Kiri (Peserta) */
        .left-no-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.22);
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 2px;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .left-no-text {
            font-size: 0.65rem;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .event-date {
            font-size: 0.45rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .stub-badge {
            font-size: 0.45rem;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 3px;
            border-radius: 2px;
            display: inline-block;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .stub-title {
            font-size: 0.55rem;
            font-weight: 700;
            margin-top: 1px;
        }

        .stub-no-box {
            background: rgba(255, 255, 255, 0.25);
            border: 1px dashed rgba(255, 255, 255, 0.6);
            padding: 2px;
            border-radius: 3px;
            margin: 2px 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .stub-no {
            font-size: 0.75rem;
            font-weight: 900;
            font-family: monospace;
        }

        .stub-input {
            font-size: 0.46rem;
            text-align: left;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 2px;
            line-height: 1.2;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }

            .main-layout {
                display: block;
            }

            .panel,
            .page-indicator {
                display: none !important;
            }

            .preview-wrapper {
                overflow: visible;
                gap: 0;
            }

            .a4-page {
                box-shadow: none;
                margin: 0;
                width: 210mm;
                height: 297mm;
                padding: 5mm;
                page-break-after: always;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="main-layout">
        <div class="panel">
            <h2>Generator Kupon Massal</h2>

            <div class="section-title">1. Informasi Acara</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputLogo">Logo Lembaga/MI</label>
                    <input type="file" id="inputLogo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="inputInstansi">Nama Lembaga</label>
                    <input type="text" id="inputInstansi" value="MI MINHAJUL UNWAN">
                </div>
                <div class="form-group">
                    <label for="inputTitle">Nama Acara</label>
                    <input type="text" id="inputTitle" value="JALAN SEHAT HARI SANTRI">
                </div>
                <div class="form-group">
                    <label for="inputSubtitle">Sub-Judul / Tema</label>
                    <input type="text" id="inputSubtitle" value="Jihad Santri Jayakan Negeri">
                </div>
                <div class="form-group">
                    <label for="inputDesc">Hadiah / Ketentuan</label>
                    <textarea id="inputDesc" rows="2">Doorprize: Sepeda, Kipas Angin, & Tabungan.</textarea>
                </div>
                <div class="form-group">
                    <label for="inputDate">Tanggal & Lokasi</label>
                    <input type="text" id="inputDate" value="22 Okt 2026 | Halaman MI">
                </div>
            </div>

            <div class="section-title">2. Generasi Seri Massal</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputTotalCoupons">Total Kupon Dicetak</label>
                    <input type="number" id="inputTotalCoupons" value="100" min="1" max="1000" step="10">
                </div>
                <div class="form-group">
                    <label for="inputStartNo">No. Awal</label>
                    <input type="number" id="inputStartNo" value="1">
                </div>
                <div class="form-group">
                    <label for="inputPrefix">Prefix Teks</label>
                    <input type="text" id="inputPrefix" value="No. ">
                </div>
            </div>

            <div class="section-title">3. Warna Kupon</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="inputBgColor">Warna Latar Kupon</label>
                    <input type="color" id="inputBgColor" value="#059669">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-print" onclick="window.print()">🖨️ Cetak / Simpan ke PDF</button>
                <button class="btn btn-download" onclick="downloadAllAsImages()">📥 Download Semua Halaman
                    (PNG)</button>
            </div>
        </div>

        <div class="preview-wrapper" id="previewContainer"></div>
    </div>

    <script>
        const inputInstansi = document.getElementById('inputInstansi');
        const inputTitle = document.getElementById('inputTitle');
        const inputSubtitle = document.getElementById('inputSubtitle');
        const inputDesc = document.getElementById('inputDesc');
        const inputDate = document.getElementById('inputDate');
        const inputTotalCoupons = document.getElementById('inputTotalCoupons');
        const inputStartNo = document.getElementById('inputStartNo');
        const inputPrefix = document.getElementById('inputPrefix');
        const inputLogo = document.getElementById('inputLogo');
        const inputBgColor = document.getElementById('inputBgColor');
        const previewContainer = document.getElementById('previewContainer');

        let logoSrc = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='80' height='30' viewBox='0 0 80 30'%3E%3Crect width='80' height='30' fill='%23ffffff' opacity='0.3' rx='4'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-size='8' font-family='sans-serif'%3ELOGO MI%3C/text%3E%3C/svg%3E";

        function renderAllPages() {
            previewContainer.innerHTML = '';

            const total = parseInt(inputTotalCoupons.value) || 10;
            const startNum = parseInt(inputStartNo.value) || 1;
            const prefix = inputPrefix.value || 'No. ';
            const couponsPerPage = 10;
            const totalPages = Math.ceil(total / couponsPerPage);
            const chosenColor = inputBgColor.value;

            let currentCounter = startNum;

            for (let page = 1; page <= totalPages; page++) {
                const indicator = document.createElement('div');
                indicator.className = 'page-indicator';
                indicator.innerText = `📄 Halaman A4 Ke-${page} (Kupon ${currentCounter} s/d ${Math.min(currentCounter + couponsPerPage - 1, startNum + total - 1)})`;
                previewContainer.appendChild(indicator);

                const pageElement = document.createElement('div');
                pageElement.className = 'a4-page';

                for (let i = 0; i < couponsPerPage; i++) {
                    if (currentCounter >= startNum + total) break;

                    const formattedNo = prefix + String(currentCounter).padStart(4, '0');

                    const block = document.createElement('div');
                    block.className = 'coupon-block';
                    block.style.backgroundColor = chosenColor;

                    block.innerHTML = `
                        <!-- SISI KIRI (PESERTA / ANAK-ANAK) -->
                        <div class="coupon-main">
                            <div class="logo-row">
                                <img src="${logoSrc}" alt="Logo">
                                <div class="inst-name">${inputInstansi.value}</div>
                            </div>
                            <div>
                                <div class="event-title">${inputTitle.value}</div>
                                <div class="event-sub">${inputSubtitle.value}</div>
                                <div class="event-desc">${inputDesc.value}</div>
                            </div>
                            <div>
                                <div class="left-no-wrapper">
                                    <span style="font-size:0.45rem; opacity:0.85;">NO. KUPON:</span>
                                    <span class="left-no-text">${formattedNo}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 3px;">
                                    <div class="event-date">📅 ${inputDate.value}</div>
                                    <div style="font-size:0.42rem; opacity:0.8;">*Simpan untuk undian</div>
                                </div>
                            </div>
                        </div>

                        <!-- GARIS SOBEKAN -->
                        <div class="coupon-divider"></div>

                        <!-- SISI KANAN (PANITIA) -->
                        <div class="coupon-stub">
                            <div>
                                <span class="stub-badge">PANITIA</span>
                                <div class="stub-title">${inputTitle.value}</div>
                            </div>
                            <div class="stub-no-box">
                                <div style="font-size:0.42rem; opacity:0.85;">NO. UNDIAN</div>
                                <div class="stub-no">${formattedNo}</div>
                            </div>
                            <div class="stub-input">
                                <div>Nama: .............</div>
                                <div>Kelas: ............</div>
                            </div>
                        </div>
                    `;

                    pageElement.appendChild(block);
                    currentCounter++;
                }

                previewContainer.appendChild(pageElement);
            }
        }

        [inputInstansi, inputTitle, inputSubtitle, inputDesc, inputDate, inputTotalCoupons, inputStartNo, inputPrefix, inputBgColor].forEach(elem => {
            elem.addEventListener('input', renderAllPages);
            elem.addEventListener('change', renderAllPages);
        });

        inputLogo.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (evt) {
                    logoSrc = evt.target.result;
                    renderAllPages();
                }
                reader.readAsDataURL(file);
            }
        });

        function downloadAllAsImages() {
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach((page, index) => {
                html2canvas(page, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    useCORS: true
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Kupon_Halaman_${index + 1}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            });
        }

        renderAllPages();
    </script>
</body>

</html>
